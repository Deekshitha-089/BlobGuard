
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BlobGuard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-page">

    <header class="auth-nav">
        <a href="/" class="landing-brand">
            <span class="brand-mark">B</span>
            <span>BlobGuard</span>
        </a>

        <a href="/" class="auth-back">← Back to home</a>
    </header>

    <main class="auth-main">

        <section class="auth-card">

            <div class="auth-icon">B</div>

            <span class="auth-eyebrow">
                WELCOME BACK
            </span>

            <h1>Good to see you.</h1>

            <p class="auth-subtitle">
                Sign in to access your protected files
                and manage your versions.
            </p>

            <form action="/login" method="POST">

                <div class="auth-field">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="auth-field">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="auth-submit">
                    Log in to BlobGuard
                    <span>→</span>
                </button>

            </form>

            <div class="auth-divider">
                <span>NEW TO BLOBGUARD?</span>
            </div>

            <a href="/signup" class="auth-switch">
                Create an account
            </a>

            <p class="auth-security">
                <span>✓</span>
                Your files. Your control.
            </p>

        </section>

    </main>

    <footer class="auth-footer">
        Built with Azure Blob Storage
    </footer>

</body>
</html>
